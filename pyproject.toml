[project]
name = "axios-get"
version = "1.1.3"
description = "Informate con una notifica i vostri figli delle novità presenti sui compiti assegnati loro nel registro elettronico"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.flake8]
max-line-length = 120
exclude = [
    ".git",
    "__pycache__",
    "excluded"
]
extend-ignore = [
    "E501"
]