[project]
name = "axios-get"
version = "1.1.3"
description = "Informate con una notifica i vostri figli delle novità presenti sui compiti assegnati loro nel registro elettronico"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "requests>=2.33.1",
    "pyyaml>=6.0.3",
    "pillow>=12.2.0",
    "PIL"
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3",
  "flake8>=7.3.0",
  "flake8-pyproject>=1.2.4"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.flake8]
max-line-length = 120
exclude = [
    ".git",
    "__pycache__",
    "excluded"
]
extend-ignore = [
    "E501"
]