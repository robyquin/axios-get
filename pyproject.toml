[project]
name = "axios-get"
version = "1.1.3"
description = "Informate con una notifica i vostri figli delle novità presenti sui compiti assegnati loro nel registro elettronico"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "requests>=2.33.1",
    "pyyaml>=6.0.3",
    "pillow>=12.2.0",
    "PIL"
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3",
  "flake8>=7.3.0",
  "flake8-docstrings>=1.7.0",
  "flake8-pyproject>=1.2.4",
  "pydoclint>=0.12.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.flake8]
max-line-length = 120
exclude = [
    ".git",
    "__pycache__",
    "excluded"
]
extend-ignore = [
    "E501", # line too long
    "D202", # No blank lines allowed after function docstring
    "D401", # First line should be in imperative mood
    "D105", # Missing docstring in magic method
    "D107", # Missing docstring in __init__
]

# Opzioni del plugin pydoclint dentro flake8
style = "sphinx"
allow-init-docstring = true
check-arg-order = true